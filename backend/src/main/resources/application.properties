spring.application.name=syndeo-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SYNDEO_DB_URL:jdbc:mysql://localhost:3306/syndeo?sslMode=DISABLED&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SYNDEO_DB_USERNAME}
spring.datasource.password=${SYNDEO_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
# JWT configuration
syndeo.jwt.secret=${SYNDEO_JWT_SECRET}
syndeo.jwt.expiration-ms=${SYNDEO_JWT_EXPIRATION_MS:900000}